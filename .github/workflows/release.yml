# Publishes every package when a `v<version>` tag is pushed. npm trusted publishing (OIDC): no
# token is stored, and npm attaches provenance. Each package's trusted publisher names this file.
# Two jobs, so that only the one that runs npm can mint the publishing token: `build` checks and
# packs with read-only permissions, `publish` publishes its tarballs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # In dependency order, so no package is published before what it depends on.
  PACKAGES: core codegen layout cli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile

      - name: The tag matches every package's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for name in $PACKAGES; do
            actual="$(jq -r .version "packages/$name/package.json")"
            if [ "$actual" != "$version" ]; then
              echo "::error::@tscomfy/$name is $actual, the tag says $version"
              exit 1
            fi
          done

      - run: bun run check
      # Cleans and builds dist/, then checks the packed packages as a user installs them.
      - run: bun run test:pack

      # `bun pm pack` rewrites `workspace:` ranges.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          for name in $PACKAGES; do
            (cd "packages/$name" && bun pm pack --quiet --destination "$RUNNER_TEMP/release")
          done
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/release

      # A version already on npm is skipped, so a release that failed halfway can be re-run. A
      # prerelease (`v0.2.0-rc.1`) goes out as `next`, so `latest` stays the last release; npm 12
      # refuses one without a tag.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          for name in $PACKAGES; do
            if npm view "@tscomfy/$name@$version" version > /dev/null 2>&1; then
              echo "@tscomfy/$name@$version is already published"
            else
              npm publish --tag "$tag" "$RUNNER_TEMP/release/tscomfy-$name-$version.tgz"
            fi
          done
